services:
  dockmon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dockmon
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./dockmon_data:/dockmon_data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - APP_URL=http://localhost:8090
