<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="dockmon-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="dockmon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="dockmon-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="dockmon-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="dockmon-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#dockmon-bg)"/>
  
  <!-- Outer Hexagon Outline -->
  <path d="M256 68 L428 167.3 V365.9 L256 465.2 L84 365.9 V167.3 Z" 
        fill="none" stroke="url(#dockmon-grad)" stroke-width="6" opacity="0.4" filter="url(#glow)"/>
  
  <!-- Isometric Container / Hexagon Cube -->
  <!-- Top Face -->
  <polygon points="256,96 404,181 256,266 108,181" fill="url(#dockmon-top)"/>
  <!-- Left Face -->
  <polygon points="108,181 256,266 256,436 108,351" fill="url(#dockmon-left)"/>
  <!-- Right Face -->
  <polygon points="256,266 404,181 404,351 256,436" fill="url(#dockmon-right)"/>

  <!-- Inner Edge Highlight Borders -->
  <path d="M256 96 L404 181 L256 266 L108 181 Z
           M108 181 L256 266 L256 436 L108 351 Z
           M256 266 L404 181 L404 351 L256 436 Z" 
        fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" opacity="0.35"/>

  <!-- Monitoring Pulse Wave across the front -->
  <path d="M140 285 L190 285 L220 220 L256 340 L292 240 L322 285 L372 285" 
        fill="none" stroke="#34d399" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Glowing Core Status Dot -->
  <circle cx="256" cy="266" r="18" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="256" cy="266" r="10" fill="#10b981"/>
</svg>
